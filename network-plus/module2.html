{id:"ipv4",title:"IPv4 Address Anatomy",intro:"An IPv4 address is 32 bits, written as four decimal octets. A subnet mask or CIDR prefix separates the network portion from the host portion.",memory:"IPv4 = 32 bits = four 8-bit octets.",narr:"An IPv4 address contains thirty two bits, displayed as four decimal octets separated by dots. The subnet mask tells you which bits represent the network and which bits represent hosts. CIDR expresses the same idea with a slash prefix, such as slash twenty four.",demo:"bits",qs:[
["How many bits are in an IPv4 address?",["16","32","64","128"],1,"IPv4 uses 32 bits."],
["What does /24 represent?",["24 host addresses","24 network prefix bits","24 octets","Port 24"],1,"CIDR /24 means the first 24 bits are the network prefix."]]},
{id:"binary",title:"Binary and Octet Values",intro:"Subnetting relies on binary place values. In one octet, the bit values are 128, 64, 32, 16, 8, 4, 2, 1.",memory:"128 • 64 • 32 • 16 • 8 • 4 • 2 • 1",narr:"Each IPv4 octet contains eight binary positions. From left to right their decimal values are one hundred twenty eight, sixty four, thirty two, sixteen, eight, four, two, and one. Add the values where the bit is one to convert binary to decimal.",demo:"binary",qs:[

["Which mask matches /26?",["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"],2,"/26 uses two network bits in the final octet: 128 + 64 = 192."],

{id:"ranges",title:"Network, Host Range, Broadcast",intro:"A subnet has a network address at the start and a broadcast address at the end. Traditional IPv4 host calculations subtract those two addresses from the total.",memory:"Network = first address. Broadcast = last. Hosts live between them.",narr:"Within an IPv4 subnet, the first address identifies the network and the last address is the broadcast address. Usable host addresses are between them. For Network Plus subnetting questions, a slash twenty six has sixty four total addresses and typically sixty two usable host addresses.",demo:"range",qs:[

{id:"block",title:"Fast Subnetting with Block Size",intro:"For /25 through /30 in the last octet, block size = 256 minus the mask value. Example: /27 has mask 224, so block size is 32. Subnets start at 0, 32, 64, 96, and so on.",memory:"Block size = 256 − interesting-octet mask.",narr:"A fast subnetting method is the block size technique. Find the octet where the mask stops being 255. Subtract that mask value from 256. A slash twenty seven has 224 in the final octet, so the block size is 32. Valid subnet starts are zero, 32, 64, 96, 128, 160, 192, and 224.",demo:"block",qs:[
["What is the block size for /28?",["8","16","32","64"],1,"/28 has mask 240; 256 - 240 = 16."],
["Which is a valid /27 subnet boundary in the last octet?",["45","64","70","100"],1,"/27 boundaries occur every 32: 0, 32, 64, 96, and so on."]]},

["A Windows host self-assigns 169.254.20.5. What does this most strongly suggest?",["DNS failure","DHCP failure or unavailability","Normal public addressing","Loopback test"],1,"169.254.0.0/16 is APIPA and commonly indicates failure to obtain a DHCP lease."],
["Which address is private?",["8.8.8.8","172.20.5.9","198.51.100.20","203.0.113.9"],1,"172.20.5.9 falls inside 172.16.0.0/12."]]},
{id:"nat",title:"NAT and PAT",intro:"NAT translates addresses between networks. PAT lets many inside hosts share one or a small number of public IPv4 addresses by also translating transport-layer port numbers.",memory:"NAT translates addresses. PAT adds ports so many sessions can share an address.",narr:"Network Address Translation changes IP addressing as traffic crosses a boundary. Port Address Translation goes further by tracking transport ports, which allows many private hosts to share a single public IPv4 address while maintaining separate sessions.",demo:"nat",qs:[
["Which technology most directly allows many private hosts to share one public IPv4 address by tracking ports?",["VLAN","PAT","STP","DNS"],1,"PAT distinguishes sessions with translated port numbers."],
["What is the primary purpose of NAT?",["Resolve hostnames","Translate IP addressing between networks","Assign VLAN tags","Synchronize clocks"],1,"NAT translates IP addresses across a network boundary."]]},
{id:"ipv6",title:"IPv6 Essentials",intro:"IPv6 addresses are 128 bits and written in hexadecimal. Leading zeros may be removed within a hextet, and one continuous run of zero hextets may be compressed with ::. IPv6 does not use broadcast.",memory:"IPv6 = 128 bits, hexadecimal, :: compression once, no broadcast.",narr:"IPv6 addresses are one hundred twenty eight bits long and are written as hexadecimal hextets. You can remove leading zeros inside a hextet, and you can use a double colon once to compress one continuous sequence of zero hextets. IPv6 replaces broadcast behavior with mechanisms including multicast.",demo:"ipv6",qs:[

["Which prefix identifies IPv6 link-local addresses?",["FE80::/10","FF00::/8","127.0.0.0/8","169.254.0.0/16"],0,"IPv6 link-local addresses are in FE80::/10."],
["What is the IPv6 loopback address?",["::","::1","FF02::1","FE80::1"],1,"::1 is the IPv6 loopback address."]]}

function makeTrain(){

}
function examView(){
if(!v.exam)return '<section class="panel exam"><div class="eyebrow">Module 2 Exam</div><h1>20 shuffled questions</h1><p>Answers remain hidden until the exam is complete.</p><button class="btn primary" data-a="startExam">Start exam</button></section>';
if(v.exam.done){var c=0,by={};v.exam.qs.forEach(function(x,i){var ok=v.exam.answers[i]===x[2];if(ok)c++;if(!by[x[3]])by[x[3]]={c:0,n:0};by[x[3]].n++;if(ok)by[x[3]].c++;});var score=Math.round(c/v.exam.qs.length*100);return '<section class="panel exam"><div class="eyebrow">Exam complete</div><h1>'+score+'%</h1><div class="feedback '+(score>=80?'good':'bad')+'">'+(score>=80?'You met the 80% target.':'Review lower-scoring concepts and retake.')+'</div><h2>By concept</h2>'+Object.keys(by).map(function(id){var u=units.find(function(z){return z.id===id;});return '<div class="stat" style="margin:8px 0"><strong>'+Math.round(by[id].c/by[id].n*100)+'%</strong>'+esc(u?u.title:id)+'</div>';}).join("")+'<div class="row"><button class="btn primary" data-a="startExam">Retake</button><button class="btn secondary" data-a="home">Home</button></div></section>';}
var x=v.exam.qs[v.exam.i];
return '<section class="panel exam"><div class="eyebrow">Module 2 Exam</div><div class="progress"><span style="width:'+(v.exam.i/v.exam.qs.length*100)+'%"></span></div><h3>Question '+(v.exam.i+1)+' of '+v.exam.qs.length+'</h3><h2>'+esc(x[0])+'</h2>'+x[1].map(function(o,i){return '<button class="choice '+(v.exam.sel===i?'sel':'')+'" data-ec="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>';}).join("")+'<button class="btn primary" data-a="examNext" '+(v.exam.sel===null?'disabled':'')+'>'+(v.exam.i===v.exam.qs.length-1?'Finish exam':'Next')+'</button></section>';
}
function render(){var m=document.getElementById("main");if(v.screen==="home")m.innerHTML=home();else if(v.screen==="lesson")m.innerHTML=lesson();else if(v.screen==="trainer")m.innerHTML=trainer();else if(v.screen==="exam")m.innerHTML=examView();wire();}
function wire(){var m=document.getElementById("main");m.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){v.unit=parseInt(b.dataset.u,10);s.last=v.unit;v.q=0;v.sel=null;v.answered=false;v.demoStep=0;save();screen("lesson");};});m.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){v.sel=parseInt(b.dataset.c,10);render();};});m.querySelectorAll("[data-ec]").forEach(function(b){b.onclick=function(){v.exam.sel=parseInt(b.dataset.ec,10);render();};});m.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(b.dataset.a);};});var r=document.getElementById("rate");if(r)r.onchange=function(){v.rate=parseFloat(r.value)||1;};}
function act(a){
if(a==="home")screen("home");
else if(a==="continue"){v.unit=Math.min(s.last||0,units.length-1);v.q=0;v.sel=null;v.answered=false;v.demoStep=0;screen("lesson");}
else if(a==="trainer")screen("trainer");
else if(a==="exam")screen("exam");
else if(a==="submit"){if(v.sel===null)return;var u=units[v.unit],q=u.qs[v.q],p=up(u.id),ok=v.sel===q[2];p.n++;s.answered++;if(ok){p.c++;s.correct++;}p.m=p.n>=2&&p.c/p.n>=.8;save();v.answered=true;render();}
else if(a==="retry"){v.sel=null;v.answered=false;render();}
else if(a==="nextq"){v.q++;v.sel=null;v.answered=false;render();}
else if(a==="done"){var p=up(units[v.unit].id);p.m=p.n>0&&p.c/p.n>=.8;if(p.m&&v.unit<units.length-1){v.unit++;s.last=v.unit;v.q=0;v.sel=null;v.answered=false;v.demoStep=0;save();render();window.scrollTo(0,0);}else{save();screen("home");}}
else if(a==="speak"){if(!("speechSynthesis" in window)){alert("Speech narration is not supported in this browser.");return;}window.speechSynthesis.cancel();var z=new SpeechSynthesisUtterance(units[v.unit].narr);z.rate=v.rate;window.speechSynthesis.speak(z);}
else if(a==="pause"){if("speechSynthesis" in window)window.speechSynthesis.pause();}
else if(a==="resume"){if("speechSynthesis" in window)window.speechSynthesis.resume();}
else if(a==="stop"){stop();}
else if(a==="play"){if(v.playing){stop();render();return;}var fs=demos[units[v.unit].demo]||[];v.playing=true;render();v.timer=setInterval(function(){if(v.demoStep>=fs.length-1){stop();render();}else{v.demoStep++;render();}},3200);}
else if(a==="next"){stop();var fs=demos[units[v.unit].demo]||[];v.demoStep=Math.min(fs.length-1,v.demoStep+1);render();}
else if(a==="prev"){stop();v.demoStep=Math.max(0,v.demoStep-1);render();}
else if(a==="restart"){stop();v.demoStep=0;render();}
else if(a==="newTrain"){v.train=makeTrain();render();}
else if(a==="checkTrain"){var n=(document.getElementById("netAns").value||"").trim(),b=(document.getElementById("bcAns").value||"").trim(),ok=n===v.train.network&&b===v.train.broadcast,el=document.getElementById("trainFeedback");el.innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'Correct.':'Check the block boundaries.')+'</b> Network: '+v.train.network+' • Broadcast: '+v.train.broadcast+' • Block size: '+v.train.block+'</div>';}
else if(a==="startExam"){v.exam={qs:exam.slice().sort(function(){return Math.random()-.5;}).slice(0,20),i:0,sel:null,answers:[],done:false};render();}
else if(a==="examNext"){if(v.exam.sel===null)return;v.exam.answers.push(v.exam.sel);if(v.exam.i===v.exam.qs.length-1)v.exam.done=true;else{v.exam.i++;v.exam.sel=null;}render();}
}
document.getElementById("home").onclick=function(){screen("home");};
document.getElementById("reset").onclick=function(){if(confirm("Reset all Module 2 progress on this device?")){localStorage.removeItem(KEY);s=def();v.unit=0;v.q=0;v.sel=null;v.answered=false;screen("home");}};
render();
})();
</script>
</body>
</html>
